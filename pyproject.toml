[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-abuse-risk"
version = "0.1.0"
description = "Reproducible YelpChi graph abuse detection and review-budget strategy simulation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "matplotlib>=3.9,<4",
  "plotly>=6,<7", "streamlit>=1.50,<2", "duckdb>=1.3,<2",
  "joblib>=1.4,<2", "nbformat>=5.10,<6", "tabulate>=0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
